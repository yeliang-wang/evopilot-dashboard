name: Browser E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mock browser E2E
        run: npm run test:e2e:mock

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
